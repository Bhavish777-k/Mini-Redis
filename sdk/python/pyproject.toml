[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fastkv-client"
version = "0.1.0"
description = "Python client and CLI for the self-hosted Fast-KV router"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Fast-KV contributors"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
fastkv-cli = "fastkv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
